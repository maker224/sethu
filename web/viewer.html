<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070d" />
    <meta name="robots" content="noindex" />
    <title>Sethu — session</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=0.7.0" />
  </head>
  <body class="viewer-body">
    <svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-arrow-left" viewBox="0 0 24 24">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </symbol>
      <symbol id="i-expand" viewBox="0 0 24 24">
        <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
      </symbol>
      <symbol id="i-eye" viewBox="0 0 24 24">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-home" viewBox="0 0 24 24">
        <path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="4" y="10" width="16" height="11" rx="2" />
        <path d="M8 10V7a4 4 0 0 1 8 0v3" />
      </symbol>
      <symbol id="i-keyboard" viewBox="0 0 24 24">
        <rect x="2" y="6" width="20" height="12" rx="2" />
        <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9 14h6" />
      </symbol>
      <symbol id="i-camera" viewBox="0 0 24 24">
        <path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z" />
        <circle cx="12" cy="13" r="3.5" />
      </symbol>
      <symbol id="i-recents" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="3" />
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path d="M18 6 6 18M6 6l12 12" />
      </symbol>
      <symbol id="i-logo" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="9.5" />
        <path d="M16 6.5c4 4 4 15 0 19M16 6.5c-4 4-4 15 0 19M7 16h18" />
        <circle cx="16" cy="4" r="2" fill="currentColor" stroke="none" />
      </symbol>
    </svg>

    <header class="viewer-bar">
      <a class="icon-btn" href="/" title="Back to devices" aria-label="Back to devices">
        <svg class="icon"><use href="#i-arrow-left" /></svg>
      </a>

      <div class="viewer-title">
        <span id="status-dot" class="status-dot" title="Connecting"></span>
        <div class="viewer-title-text">
          <h1 id="host-name">Connecting…</h1>
          <p>
            <span id="host-target">—</span>
            <span id="stats" class="viewer-stats"></span>
          </p>
        </div>
      </div>

      <div id="viewer-actions" class="viewer-actions">
        <button id="fullscreen" class="btn btn-secondary" type="button" title="Toggle fullscreen">
          <svg class="icon"><use href="#i-expand" /></svg>
          <span class="btn-label">Fullscreen</span>
        </button>
        <button id="disconnect" class="btn btn-danger" type="button" title="Disconnect">
          <svg class="icon"><use href="#i-x" /></svg>
          <span class="btn-label">Disconnect</span>
        </button>
      </div>
    </header>

    <main id="stage" class="stage">
      <div id="screen" class="screen"></div>

      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <div id="overlay-spinner" class="spinner"></div>
          <h2 id="overlay-title">Connecting…</h2>
          <p id="overlay-detail">Opening a channel to your device.</p>
          <div class="overlay-actions">
            <button id="overlay-retry" class="btn btn-primary hidden" type="button">Reconnect</button>
            <a class="btn btn-secondary" href="/">Back to devices</a>
          </div>
        </div>
      </div>
    </main>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <noscript>
      <div class="noscript">Sethu needs JavaScript to stream your devices.</div>
    </noscript>

    <script type="module" src="/viewer.js?v=0.7.0"></script>
  </body>
</html>
